# =============================================================================
# Piston Engine Digital Twin — Production Docker Compose Stack
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piston-engine-twin
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=sqlite+aiosqlite:///./data/digital_twin.db
      - TELEMETRY_SOURCE=simulator
      - CONFIG_PATH=config/default.yaml
      - DEPLOYMENT_ROLE=GROUND_STATION
    volumes:
      - ./config:/app/config:ro
      - ./models:/app/models:ro
      - ./data:/app/data
      - app-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/v1/system/health'); r.raise_for_status()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  app-logs:
