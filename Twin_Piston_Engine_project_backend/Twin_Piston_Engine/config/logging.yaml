# =============================================================================
# Logging Configuration
# =============================================================================

version: 1
disable_existing_loggers: false

formatters:
  json:
    class: src.core.logging.JsonFormatter
    format: "%(asctime)s %(name)s %(levelname)s %(message)s"
  simple:
    format: "%(asctime)s [%(levelname)-8s] %(name)s: %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: json
    filename: logs/digital_twin.log
    maxBytes: 10485760    # 10 MB
    backupCount: 5
    encoding: utf-8

loggers:
  src.l1_data:
    level: INFO
  src.l1_data.simulator:
    level: WARNING
  src.l2_digital_twin:
    level: INFO
  src.l3_ml:
    level: INFO
  src.l4_advisory:
    level: INFO
  src.l5_interface:
    level: INFO
  uvicorn:
    level: INFO

root:
  level: INFO
  handlers: [console]
