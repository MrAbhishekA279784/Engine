# =============================================================================
# Piston Engine Digital Twin — Default Configuration
# Rotax 915 iS — All values externalized, no hardcoding in business logic.
# =============================================================================

version: "1.0.0"

engine:
  name: "Rotax 915 iS"
  bore_mm: 84.0
  stroke_mm: 61.0
  displacement_cc: 1352.0
  num_cylinders: 4
  compression_ratio: 10.5
  rated_power_kw: 104.0               # peak 104 kW / 141 hp, flyrotax.com/products/915-is-a-isc-a
  max_continuous_power_kw: 99.0       # 99.0 kW / 135 hp at 5500 1/min, same source
  max_continuous_rpm: 5500
  tbo_hours: 1200.0                   # TBO 1,200 h, same source
  rated_rpm: 5800
  max_rpm: 5800
  firing_order: [1, 3, 2, 4]          # Boxer firing order
  connecting_rod_mm: 105.0             # Estimated for Rotax 915 iS
  intake_valve_close_btdc_deg: 50.0
  exhaust_valve_open_bbdc_deg: 55.0
  piston_mass_kg: 0.35                 # Estimated
  conrod_mass_kg: 0.30                 # Estimated
  fuel_type: "avgas_100ll"
  lhv_mj_per_kg: 43.5                 # Lower heating value of Avgas 100LL
  stoichiometric_afr: 14.7             # Air-fuel ratio at stoichiometry
  # Twin FMEP: Barnes-Moss, Heywood (1988) ch. 13 -- VERIFY equation number.
  # fmep[bar] = a + b (N/1000) + c (N/1000)^2, x (mu/mu_ref)^0.25
  fmep_barnes_moss_a_bar: 0.97
  fmep_barnes_moss_b_bar: 0.15
  fmep_barnes_moss_c_bar: 0.05
  fmep_viscosity_exponent: 0.25

turbocharger:
  max_boost_bar: 1.45
  wastegate_target_bar: 1.35
  compressor_efficiency: 0.72
  turbine_efficiency: 0.68
  compressor_pr_max: 2.5              # Max pressure ratio
  turbine_pr_max: 2.0
  shaft_inertia_kg_m2: 0.00005        # Turbo spool inertia
  wastegate_kp: 2.0                   # PI controller proportional gain
  wastegate_ki: 0.5                   # PI controller integral gain

lubrication:
  oil_type: "AeroShell Sport Plus 4"
  nominal_pressure_bar: 4.0
  min_pressure_bar: 1.5
  max_pressure_bar: 7.0
  nominal_temp_c: 90.0
  max_temp_c: 130.0
  min_temp_c: 40.0
  # Vogel equation coefficients for viscosity: μ = A * exp(B / (T - C))
  # Approximate for aviation oil
  vogel_a: 0.0002
  vogel_b: 1200.0
  vogel_c: 140.0      # T in Kelvin

cooling:
  coolant_type: "50/50 ethylene glycol"
  thermostat_open_c: 85.0
  thermostat_full_open_c: 95.0
  nominal_cht_c: 100.0
  max_cht_c: 135.0
  coolant_flow_rate_kg_s: 1.0
  coolant_specific_heat_j_kg_k: 3500.0
  radiator_effectiveness: 0.65

telemetry:
  sample_rate_hz: 1.0
  num_channels: 38

simulator:
  time_step_s: 0.001                  # 1 ms for crank-angle resolution
  cycles_per_output: 1                # Output every N engine cycles
  default_rpm: 4000
  default_throttle_pct: 50.0
  default_altitude_m: 1000.0
  default_ambient_temp_k: 288.15      # ISA sea level = 15°C
  default_ambient_pressure_pa: 101325.0
  sensor_noise:
    rpm_std: 5.0
    temperature_std_k: 1.5
    pressure_std_pa: 500.0
    vibration_std_m_s2: 0.2
    fuel_flow_std_kg_s: 0.0001
    voltage_std_v: 0.05
    lambda_std: 0.005
  sensor_dropout_probability: 0.001
  # Ground-truth engine physics (simulator-only constants; see
  # SimulatorPhysicsConfig). VERIFY-marked values need the Rotax 915 iS manual.
  physics:
    charge_temp_rise_k: 28.0
    max_map_pa: 160000.0
    eta_v_peak: 0.92                  # VERIFY
    eta_v_peak_rpm: 4500.0
    lambda_schedule_load: [0.0, 0.75, 1.0]     # VERIFY mixture schedule
    lambda_schedule_lambda: [1.00, 1.00, 0.87] # VERIFY
    indicated_efficiency: 0.40        # VERIFY
    # Barnes-Moss FMEP, Heywood (1988) ch. 13 -- VERIFY equation number
    fmep_barnes_moss_a_bar: 0.97
    fmep_barnes_moss_b_bar: 0.15
    fmep_barnes_moss_c_bar: 0.05

pipeline:
  cycle_timeout_ms: 500
  max_invalid_channels_before_halt: 10
  residual_window_size: 60            # Samples for rolling statistics
  enable_persistence: true
  persistence_interval_s: 5.0         # Snapshot to DB every N seconds

ml:
  anomaly_threshold: 0.85
  fault_confidence_threshold: 0.70
  rul_horizon_hours: 500
  health_index_weights:
    thermal: 0.25
    mechanical: 0.25
    combustion: 0.25
    lubrication: 0.15
    vibration: 0.10
  degradation_states:
    healthy: 0.8
    watch: 0.6
    caution: 0.4
    warning: 0.2
    critical: 0.0

advisory:
  severity_levels:
    monitor: 0.7
    schedule_maintenance: 0.5
    immediate_inspection: 0.3
    ground_aircraft: 0.1

security:
  hmac_algorithm: "sha256"
  secret_key_env_var: "TELEMETRY_SECRET_KEY"
  default_secret_key: "dev_prototype_secret_key_change_in_prod"
  require_signature: true
  max_sequence_gap: 1000
  stale_timeout_s: 5.0
  per_channel_stale_timeouts_s:
    egt_cyl1_hot_uv: 3.0
    egt_cyl2_hot_uv: 3.0
    egt_cyl3_hot_uv: 3.0
    egt_cyl4_hot_uv: 3.0
persistence:
  enabled: true
  storage_backend: "in_memory"
  storage_path: "data/raw_telemetry.db"
  max_records: 100000

raw_channel_ranges:
  egt_cyl1_hot_uv: { min: 0.0, max: 60000.0 }
  egt_cyl2_hot_uv: { min: 0.0, max: 60000.0 }
  egt_cyl3_hot_uv: { min: 0.0, max: 60000.0 }
  egt_cyl4_hot_uv: { min: 0.0, max: 60000.0 }
  egt_cold_c: { min: -40.0, max: 85.0 }
  cht_hot_uv: { min: 0.0, max: 25000.0 }
  cht_cold_c: { min: -40.0, max: 85.0 }
  oil_rtd_ohms: { min: 50.0, max: 300.0 }
  oil_p_counts: { min: 0, max: 4095 }
  map_counts: { min: 0, max: 4095 }
  adc_vref_counts: { min: 2000, max: 4095 }
  crank_period_us: { min: 5000.0, max: 600000.0 }
  fuel_pulse_hz: { min: 0.0, max: 1000.0 }
  ambient_temp_c: { min: -60.0, max: 60.0 }
  ambient_press_pa: { min: 30000.0, max: 110000.0 }
  # Prompt 11 raw signals. Basis: 12-bit ADC full scale (0-4095 counts), as
  # for map_counts / oil_p_counts. coolant_ntc_ohms: no range until the NTC
  # part is chosen (VERIFY against Rotax 915 iS Operators Manual / sensor data).
  bus_v_counts: { min: 0, max: 4095 }
  alt_i_counts: { min: 0, max: 4095 }
  fuel_press_counts: { min: 0, max: 4095 }
  batt_i_counts: { min: 0, max: 4095 }

# Channel valid ranges for packet integrity validation
channel_ranges:
  rpm: { min: 0, max: 6500 }
  map_pressure: { min: 20000, max: 200000 }
  throttle_position: { min: 0, max: 100 }
  egt: { min: 300, max: 1200 }         # Per-cylinder EGT (K)
  cht: { min: 300, max: 500 }          # Per-cylinder CHT (K)
  oil_temp: { min: 270, max: 430 }
  oil_pressure: { min: 0, max: 800000 }
  coolant_temp: { min: 270, max: 420 }
  fuel_flow: { min: 0, max: 0.015 }
  fuel_pressure: { min: 100000, max: 600000 }
  intake_air_temp: { min: 220, max: 340 }
  ambient_pressure: { min: 30000, max: 110000 }
  ambient_temp: { min: 210, max: 330 }
  voltage: { min: 0, max: 16 }
  current: { min: 0, max: 50 }
  vibration: { min: 0, max: 500 }
  propeller_speed: { min: 0, max: 3000 }
  boost_pressure: { min: 80000, max: 200000 }
  wastegate_duty: { min: 0, max: 100 }
  lambda_sensor: { min: 0.5, max: 1.5 }
  ignition_timing: { min: 0, max: 60 }
  altitude: { min: 0, max: 15000 }
  engine_hours: { min: 0, max: 100000 }
