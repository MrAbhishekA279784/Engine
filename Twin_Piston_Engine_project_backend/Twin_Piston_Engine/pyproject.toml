[project]
name = "piston-engine-digital-twin"
version = "0.1.0"
description = "AI-Enabled Real-Time Digital Twin for Aero Piston Engine Health Monitoring, Fault Prediction and Mission Reliability in MALE UAVs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Arpan" },
]

dependencies = [
    # --- API ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # --- Validation & Config ---
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    # --- Database ---
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    # --- Scientific / Physics ---
    "numpy>=1.26",
    "scipy>=1.13",
    # --- ML Inference ---
    "onnxruntime>=1.18",
    # --- HTTP client (for tests & internal) ---
    "httpx>=0.27",
    # --- WebSocket ---
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]
train = [
    # Training-only deps (not needed at runtime)
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "onnx>=1.16",
    "skl2onnx>=1.17",
    "torch>=2.3",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pyarrow>=17",  # Parquet datasets (Prompt 16)
    "joblib>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long — handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "onnxruntime.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "property: marks property-based tests",
    "boundary: marks L1-L2 boundary enforcement tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/l1_data/simulator/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
